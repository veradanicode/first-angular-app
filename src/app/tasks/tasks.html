@if (isAddTaskVisible) {
  <app-new-task [userId]="userId()" (close)="onCloseTask()" />
}

<section id="tasks">
  <header>
    <h1>{{ name() }}'s Tasks</h1>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of getUserTasks(); track task.id) {
      <li><app-task [task]="task" /></li>
    }
  </ul>
</section>
